name: Release

on:
  push:
    tags: ["v*"]
  # Called by auto-release.yml: a tag pushed with GITHUB_TOKEN does not trigger the push event.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release, e.g. v1.2.3
        type: string
        required: true
      notes:
        description: Release notes in markdown
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # GitHub retired the macos-13 Intel image, so the Intel binary is cross-compiled on Apple Silicon.
          - { os: macos-latest, target: x86_64-apple-darwin, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # A cross-compiled binary can't run on the build machine; the same tests run natively on the other targets.
      - if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../obsidian-connector-${{ matrix.target }}.tar.gz obsidian-connector
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/obsidian-connector.exe -DestinationPath obsidian-connector-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: obsidian-connector-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: ${{ inputs.notes }}
          files: obsidian-connector-*
          generate_release_notes: true
